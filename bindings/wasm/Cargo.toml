[package]
name = "qalqon-wasm"
description = "The core for browsers: runs in a Web Worker, with JavaScript answering its transport commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crypto-provider = { workspace = true }
provider-testonly = { workspace = true }
keystore-webcrypto = { path = "../../core/keystore-webcrypto" }
qalqon-core = { workspace = true }
qalqon-api = { workspace = true }
qalqon-signal = { workspace = true }
qalqon-conformance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CryptoKey"] }

[lints]
workspace = true

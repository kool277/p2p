# TURN for WebRTC paths that NAT traversal cannot complete. It relays packets it cannot read:
# Qalqon's end-to-end handshake runs on top, so TURN is never trusted with anything.
#
# This is a development configuration. Before production, replace the static secret, set
# `realm`, add TLS certificates and restrict `allowed-peer-ip`.
listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=development-only-replace-me
realm=qalqon.local
no-cli
no-multicast-peers
no-loopback-peers
min-port=49160
max-port=49200

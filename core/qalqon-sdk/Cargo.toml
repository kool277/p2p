[package]
name = "qalqon-sdk"
description = "The native SDK: the public API with blocking calls, built-in transports on background threads, and the server core behind its IDL types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Until the certified library arrives, the only provider is the test-only one, which
# refuses to compile in a release profile.
default = ["testonly"]
testonly = ["dep:provider-testonly"]

[dependencies]
crypto-provider = { workspace = true }
qalqon-core = { workspace = true }
qalqon-audit = { workspace = true }
qalqon-api = { workspace = true }
qalqon-signal = { workspace = true }
qalqon-conformance = { workspace = true }
server-core = { workspace = true }
keystore-file = { workspace = true }
provider-testonly = { workspace = true, optional = true }
serde_json = { workspace = true }
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"

[lints]
workspace = true

[package]
name = "provider-testonly"
description = "A provider built from public crates so engine work can proceed before the library arrives. NOT FOR RELEASE: it refuses to compile in a release profile."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
crypto-provider = { workspace = true }
crypto-ext = { workspace = true }
zeroize = { workspace = true }
sha2 = { version = "0.11", default-features = false }
aes = { version = "0.9", default-features = false }
ctr = { version = "0.10", default-features = false }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
getrandom = { version = "0.4", features = ["sys_rng"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
